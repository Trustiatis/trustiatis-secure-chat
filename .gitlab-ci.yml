# Intégration continue de Trustiatis Secure.
#
# État : squelette de Phase 2. Aucune compilation n'est encore faite ici, parce qu'aucun
# runner n'est déclaré et qu'aucune chaîne de construction n'a été vérifiée. Les étapes de
# compilation seront ajoutées en Phase 6, avec les runners décrits au chapitre 14 de
# docs/INITIAL_AUDIT.md.
#
# Règle du projet : ne jamais prétendre qu'une compilation a réussi sans preuve.

stages:
  - controles

default:
  interruptible: true

# ---------------------------------------------------------------------------
# Quels pipelines existent.
#
# Sans ce bloc, pousser six branches de travail d'un coup crée six pipelines, et chacun
# échoue avec « 0 job » parce qu'aucune règle de job ne correspond à une branche de
# travail. Un pipeline en échec qui n'avait rien à faire est du bruit, et le bruit finit
# par faire ignorer les vrais échecs.
#
# Ici, la décision est prise une fois, à la création du pipeline, et non job par job.
# ---------------------------------------------------------------------------
workflow:
  rules:
    # Demande de fusion : c'est le pipeline qui compte pour la relecture.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Jamais de pipeline de branche en double quand une demande de fusion est ouverte.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Les deux branches intégratrices.
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    # Tout le reste, branches de travail, branches de référence et étiquettes : rien.
    # Un pipeline qui n'existe pas vaut mieux qu'un pipeline vide en échec.
    - when: never

# ---------------------------------------------------------------------------
# Test du contrôle de marque lui même, bloquant celui là.
#
# Le contrôle tranche, ligne à ligne, entre le nom du produit et un objet du
# réseau, et il le fait avec des expressions rationnelles. Une expression trop
# large ne se voit pas : elle rend le contrôle silencieux, ce qui est pire que
# pas de contrôle. Le job « marque » étant en avertissement jusqu'à la fin de la
# Phase 2, c'est ici que se trouve le garde-fou.
# ---------------------------------------------------------------------------
marque-test:
  stage: controles
  image: python:3.12-slim
  script:
    - python3 tools/test-verifier-marque.py

# ---------------------------------------------------------------------------
# Contrôle de marque : aucune occurrence interdite de la marque de l'amont.
# Avertissement tant que la Phase 2 n'est pas finie, bloquant ensuite.
# ---------------------------------------------------------------------------
marque:
  stage: controles
  image: python:3.12-slim
  allow_failure: true          # à passer à false à la fin de la Phase 2
  script:
    # Le détail part en artefact, pas dans le journal : 2 957 signalements font un
    # journal de 500 Kio que GitLab tronque, et un journal tronqué n'apprend rien.
    # `--resume` donne la répartition et un échantillon, et rend le même code de sortie.
    - python3 tools/verifier-marque.py --json > marque-complet.json || true
    - python3 tools/verifier-marque.py --resume
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - marque-complet.json

# ---------------------------------------------------------------------------
# Typographie : la décision du Membre interdit le tiret long et le tiret
# demi-long dans les documents produits.
# ---------------------------------------------------------------------------
typographie:
  stage: controles
  image: alpine:3.20
  script:
    - sh tools/verifier-typographie.sh

# ---------------------------------------------------------------------------
# Garde-fou de la décision D-2 : le coeur Haskell n'est pas modifié.
# Toute différence avec la branche de référence de l'amont fait échouer la CI.
# ---------------------------------------------------------------------------
coeur-intact:
  stage: controles
  # Deux précautions, chacune apprise à ses dépens le 2026-11-15 :
  #   - `entrypoint: [""]` est obligatoire. L'image alpine/git déclare `git` comme point
  #     d'entrée, donc sans cela le runner exécute `git sh` et le job meurt sur
  #     « git: 'sh' is not a git command ». Ne pas retirer cette ligne.
  #   - la version est figée. `latest` sur une image de contrôle de sécurité veut dire
  #     que le contrôle peut changer sans que nous changions rien.
  image:
    name: alpine/git:v2.52.0
    entrypoint: [""]
  # GitLab ne clone par défaut que la référence testée, et en profondeur réduite : la
  # branche de référence de l'amont serait absente, le contrôle passerait sans rien
  # contrôler, et un garde-fou qui passe en silence est pire que pas de garde-fou. On
  # récupère donc explicitement cette référence depuis le distant.
  #
  # La référence est lue dans tools/amont-courant.txt et non devinée. La version
  # précédente prenait la branche upstream-* de plus haut numéro, ce qui supposait que
  # l'on n'avance jamais que vers l'avant. Le 2026-11-15, la greffe est repassée de
  # v7.1.3 à v7.1.2 : l'heuristique aurait comparé le dépôt à une version que nous
  # n'utilisons plus, et le contrôle aurait échoué sans qu'il y ait de faute.
  variables:
    GIT_DEPTH: 0
  script:
    - |
      ref=$(tr -d '[:space:]' < tools/amont-courant.txt)
      if [ -z "$ref" ]; then
        echo "ERREUR : tools/amont-courant.txt est vide."
        echo "Ce fichier nomme la branche d'amont pur sur laquelle la greffe repose."
        exit 1
      fi
      if ! git ls-remote --exit-code --heads origin "refs/heads/$ref" >/dev/null 2>&1; then
        echo "ERREUR : la branche $ref est absente du distant."
        echo "Elle est la preuve de ce que vaut l'amont. Sans elle, rien n'est vérifiable."
        exit 1
      fi
      echo "Référence d'amont : $ref"
      git fetch --no-tags origin "refs/heads/$ref:refs/heads/$ref" 2>/dev/null \
        || echo "   (déjà présente localement)"
      # Le coeur et sa recette : aucune différence, jamais.
      coeur=$(git diff --name-only "$ref" HEAD -- src/ flake.nix flake.lock cabal.project)
      if [ -n "$coeur" ]; then
        echo "ERREUR : le coeur de l'amont a été modifié, ce qu'interdit la décision D-2 :"
        echo "$coeur"
        exit 1
      fi
      # scripts/ se juge autrement, et c'est le 2026-11-16 qui l'a montré : comparer ce
      # répertoire en bloc faisait échouer le contrôle sur des scripts qui sont de nous.
      # Ajouter un fichier à côté de ceux de l'amont n'est pas modifier l'amont. Une
      # modification d'un fichier de l'amont, elle, doit être nommée dans
      # tools/amont-modifies.txt, et ce fichier renvoie à docs/BRANDING.md.
      liste=tools/amont-modifies.txt
      [ -f "$liste" ] || { echo "ERREUR : $liste est absent."; exit 1; }
      git diff --name-status "$ref" HEAD -- scripts/ > etat-scripts.txt
      : > fautes-scripts.txt
      while read -r statut chemin reste; do
        [ -n "$statut" ] || continue
        case "$statut" in
          A) continue ;;
        esac
        if grep -v '^[[:space:]]*#' "$liste" | grep -qxF "$chemin"; then
          continue
        fi
        echo "  $statut $chemin $reste" >> fautes-scripts.txt
      done < etat-scripts.txt
      if [ -s fautes-scripts.txt ]; then
        echo "ERREUR : des fichiers de l'amont sous scripts/ sont modifiés sans être"
        echo "nommés dans $liste :"
        cat fautes-scripts.txt
        echo "Soit la modification n'a pas lieu d'être, soit elle est délibérée et doit"
        echo "être consignée dans docs/BRANDING.md puis ajoutée à cette liste."
        exit 1
      fi
      # Une entrée qui ne correspond plus à rien autorise en silence une modification
      # future du même fichier. On ne fait pas échouer le job pour autant : après un
      # report, un fichier peut légitimement redevenir identique à l'amont.
      grep -v '^[[:space:]]*#' "$liste" | grep -v '^[[:space:]]*$' | while read -r voulu; do
        if ! awk '{print $2}' etat-scripts.txt | grep -qxF "$voulu"; then
          echo "AVERTISSEMENT : $voulu est dans $liste mais n'est plus modifié. Entrée à retirer."
        fi
      done
      echo "Coeur intact, et les écarts sous scripts/ sont tous déclarés."

# ---------------------------------------------------------------------------
# Aucun secret committé.
# ---------------------------------------------------------------------------
secrets:
  stage: controles
  image: alpine:3.20
  script:
    - |
      motifs='\.jks$|\.keystore$|\.p12$|\.pfx$|\.p8$|\.mobileprovision$|^local\.properties$|^keystore\.properties$'
      trouve=$(git ls-files | grep -E "$motifs" || true)
      if [ -n "$trouve" ]; then
        echo "ERREUR : fichiers de secret versionnés :"
        echo "$trouve"
        exit 1
      fi
      echo "Aucun secret versionné."
